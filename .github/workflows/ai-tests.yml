name: AI analyzer tests

on:
  pull_request:
    paths:
      - "modules/ai_analyzer.py"
      - "modules/critic.py"
      - "tests/**"
      - ".github/workflows/ai-tests.yml"
  push:
    branches:
      - main
      - "fix/ai-routing-cost-guardrails"

jobs:
  ai-analyzer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install requests groq
      - name: Compile changed Python files
        run: python -m py_compile modules/ai_analyzer.py modules/critic.py tests/test_ai_analyzer.py
      - name: Run offline AI analyzer tests
        run: python -m unittest discover -s tests -v
