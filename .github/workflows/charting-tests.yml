name: Charting tests

on:
  pull_request:
    paths:
      - "modules/charting.py"
      - "modules/media.py"
      - "modules/telegram_sender.py"
      - "tests/test_charting.py"
      - ".github/workflows/charting-tests.yml"
  push:
    branches:
      - main
      - "fix/chart-img-403-diagnostics"
      - "fix/photo-provider-validation"
    paths:
      - "modules/charting.py"
      - "modules/media.py"
      - "modules/telegram_sender.py"
      - "tests/test_charting.py"
      - ".github/workflows/charting-tests.yml"

jobs:
  charting-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install charting test dependencies
        run: python -m pip install --upgrade pip requests matplotlib yfinance aiohttp Pillow python-telegram-bot
      - name: Run charting, photo provider, and Telegram sender tests
        run: python -m unittest tests.test_charting -v
