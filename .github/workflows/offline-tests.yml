name: Offline tests

on:
  push:
    branches: [main, fix/postgres-storage-migration]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "python-telegram-bot>=22.6" requests groq aiohttp feedparser aiosqlite
      - name: Compile news pipeline and storage
        run: python -m py_compile modules/news_sources.py modules/ai_analyzer.py modules/pipeline.py modules/storage.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
