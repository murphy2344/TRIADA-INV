name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "python-telegram-bot>=22.6" "aiosqlite>=0.19.0" "psycopg[binary]>=3.2.0"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
