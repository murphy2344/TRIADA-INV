name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: triada_test
          POSTGRES_USER: triada_test
          POSTGRES_PASSWORD: triada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triada_test -d triada_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://triada_test:triada_test@localhost:5432/triada_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "python-telegram-bot>=22.6" "aiosqlite>=0.19.0" "psycopg[binary]>=3.2.0"
      - name: Run offline and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
